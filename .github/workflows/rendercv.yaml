name: Render and Deploy CV

on:
  push:
    branches:
      - main
    paths:
      - 'src/render_cv.yaml'
      - 'build_html.py'
      - '.github/workflows/rendercv.yaml'
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  rendercv:
    name: RenderCV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install RenderCV
        run: |
          pip install -r requirements.txt
      - name: RenderCV
        run: |
          mkdir -p output
          rendercv render src/render_cv.yaml
          cp src/rendercv_output/*.pdf ./output/cv.pdf
          cp src/rendercv_output/*.md ./output/cv.md
      - name: Generate HTML
        run: |
          python3 build_html.py
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    name: Deploy to GitHub Pages
    needs: rendercv
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
